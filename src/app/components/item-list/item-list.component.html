<div class="container" style="max-width: 600px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); font-family: Tahoma, sans-serif; direction: rtl;">
  <h2 style="color: #2c3e50; text-align: center; margin-top: 0;">ثبت اطلاعات فردی و نمرات</h2>

  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">نام:</label>
      <input type="text" [(ngModel)]="firstName" name="firstName" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 15px;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">نام خانوادگی:</label>
      <input type="text" [(ngModel)]="lastName" name="lastName" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <h4 style="color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px;">درصد دروس:</h4>
    <div *ngFor="let sub of subjects" style="margin-bottom: 12px;">
      <label style="display: block; margin-bottom: 4px;">{{ sub.name }} (ضریب: {{ sub.coefficient }}):</label>
      <input type="number" min="0" max="20" step="0.25" [(ngModel)]="scores[sub.id]" name="sub_{{sub.id}}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <button type="submit" style="margin-top: 20px; width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;">محاسبه معدل و ثبت در سیستم</button>
  </form>

  <div *ngIf="lastResult" style="background: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 6px; margin-top: 25px;">
    <h3 style="color: #16a085; margin-top: 0;">نتیجه ثبت برای {{ lastResult.firstName }} {{ lastResult.lastName }}:</h3>
    <p style="font-size: 18px; margin-bottom: 0;"><strong>معدل وزنی کل: </strong> <span style="font-size: 22px; color: #27ae60; font-weight: bold;">{{ lastResult.gpa }}</span></p>
  </div>
</div>
